name: Build APK

# 打 tag 就打包（tag 名就是版本号，带不带 v 前缀都认）。
# 也可以在 Actions 页手动跑一次，产物在 run 页面的 Artifacts 里。
on:
  push:
    tags: ["*"]
  workflow_dispatch:

permissions:
  contents: write      # 挂 Release 需要写权限

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # app/build.gradle.kts 要求 JDK 17（sourceCompatibility / jvmTarget 都是 17）
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # 仓库里 gradlew 存的是 100644，Linux 上直接 ./gradlew 会 permission denied。
      # （上游一直没有 CI，所以没人碰到过；这边每次跑都补一下。）
      - name: 给 gradlew 加执行位
        run: chmod +x gradlew

      # tag（1.0 / v1.0）→ versionName（1.0）。只改工作区，不提交。
      - name: 用 tag 覆盖 versionName
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          V="${GITHUB_REF_NAME#v}"
          echo "tag $GITHUB_REF_NAME → versionName $V"
          sed -i "s/^\([[:space:]]*versionName = \)\"[^\"]*\"/\1\"$V\"/" app/build.gradle.kts
          grep -n "versionName" app/build.gradle.kts

      # 出的是 debug 包：用 Android 自带的 debug keystore 签名，能直接装。
      # 代价是签名跟正式包不同，**装之前要先卸载已装的正式版**，卸载会清掉密钥和设置。
      # 正式签名材料不在仓库里（.gitignore 排除 *.jks / keystore.properties，
      # build.gradle.kts 从 JEV_KEYSTORE_PROPS 指的仓库外文件读），跑 CI 拿不到，
      # 所以这里不碰 assembleRelease —— 没有签名材料时它出的是装不上的包。
      - name: 打包（debug）
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 收集产物
        run: |
          mkdir -p out
          SUF=""
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then SUF="-${GITHUB_REF_NAME#v}"; fi
          cp app/build/outputs/apk/debug/app-debug.apk "out/jev-assistant${SUF}-debug.apk"
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk

      # 单测放最后、且不阻断：先保证有包可用，测试结果照样在 run 里看得见。
      # 注意这条现在是红的（2026-09-29 第一次跑挂在 test），原因还没查——
      # 错在测试代码的话不影响上面的包，错在主干代码的话上面的打包步骤会先失败。
      - name: 单测（不阻断打包）
        continue-on-error: true
        run: ./gradlew test --no-daemon --stacktrace

      - name: 挂到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          body: |
            **debug 签名包**：能直接装，但签名跟正式版不同，装之前要先卸载已装的正式版
            （卸载会清掉密钥和设置）。

            构建自 `${{ github.sha }}`（tag `${{ github.ref_name }}`）。
            聊天文字只在本机处理，这个包不含任何密钥。
